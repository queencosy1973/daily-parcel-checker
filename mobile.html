<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QueenCosy Mobile Scanner - สแกนพัสดุหน้ารถ</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- SheetJS CDN (Local Vendor) -->
  <script src="xlsx.full.min.js"></script>

  <!-- HTML5-QRCode CDN (Local Vendor) -->
  <script src="html5-qrcode.min.js"></script>

  <!-- Supabase JS CDN (Local Vendor) -->
  <script src="supabase.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col select-none">

  <!-- Mobile Top Header -->
  <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 sticky top-0 z-30 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-emerald-600 flex items-center justify-center font-bold text-sm text-white shadow">
        QC
      </div>
      <div>
        <div class="flex items-center gap-1.5">
          <h1 class="text-sm font-bold text-white tracking-tight leading-tight">จุดสแกนพัสดุหน้ารถ</h1>
          <span class="px-1.5 py-0.2 rounded-full text-[9px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">v2.6</span>
        </div>
        <p class="text-[10px] text-emerald-400 font-mono" id="mobile-date-display">2026-09-23</p>
      </div>
    </div>
    
    <div class="flex items-center gap-2">
      <!-- Live Sync Indicator -->
      <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
        Sync Online
      </span>
      <a href="index.html" class="p-1 text-slate-400 hover:text-white rounded-lg">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
      </a>
    </div>
  </header>

  <!-- Mobile Main Content -->
  <main class="flex-1 p-3 space-y-3 max-w-md w-full mx-auto flex flex-col">
    
    <!-- Operator & Target Date Setup Bar -->
    <div class="bg-slate-800/80 rounded-xl p-2.5 border border-slate-700 flex items-center justify-between gap-2 text-xs">
      <div class="flex items-center gap-1.5 flex-1 min-w-0">
        <i data-lucide="user" class="w-3.5 h-3.5 text-slate-400"></i>
        <input type="text" id="input-mobile-scanner-name" value="มือถือหน้ารถ" placeholder="ชื่อผู้สแกน" class="bg-transparent border-none text-white text-xs font-medium focus:outline-none w-full">
      </div>
      <div class="text-[11px] font-mono text-slate-300 bg-slate-700 px-2 py-1 rounded-lg">
        สแกนแล้ว: <span id="mobile-scanned-count" class="font-bold text-emerald-400">0</span>
      </div>
    </div>

    <!-- Camera Viewfinder Box (Anti-freeze guard) -->
    <div class="relative overflow-hidden rounded-2xl border-2 border-emerald-500 bg-black aspect-[4/3] flex items-center justify-center shadow-lg" id="camera-box-mobile">
      <div id="reader-mobile" class="w-full h-full"></div>
      
      <!-- Visual Scan Reticle Guide Overlay -->
      <div class="absolute inset-0 pointer-events-none flex items-center justify-center p-6">
        <div class="w-full h-32 border-2 border-dashed border-emerald-400/70 rounded-xl flex items-center justify-center">
          <span class="text-[11px] text-emerald-300/80 bg-black/60 px-2 py-0.5 rounded font-medium">
            วางบาร์โค้ด Tracking ID ในกรอบนี้
          </span>
        </div>
      </div>
    </div>

    <!-- Camera Control Buttons -->
    <div class="grid grid-cols-2 gap-2">
      <button id="btn-toggle-mobile-camera" class="w-full py-2.5 px-3 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-700 active:scale-98 rounded-xl shadow transition flex items-center justify-center gap-1.5">
        <i data-lucide="camera" class="w-4 h-4"></i>
        เปิดกล้องสแกน
      </button>
      <button id="btn-manual-input-toggle" class="w-full py-2.5 px-3 text-xs font-bold text-slate-200 bg-slate-800 hover:bg-slate-700 rounded-xl border border-slate-700 transition flex items-center justify-center gap-1.5">
        <i data-lucide="keyboard" class="w-4 h-4"></i>
        พิมพ์เลขพัสดุ
      </button>
    </div>

    <!-- Manual Input Container (Collapsible) -->
    <div id="manual-input-box" class="hidden bg-slate-800 p-3 rounded-xl border border-slate-700 space-y-2">
      <div class="flex gap-2">
        <input type="text" id="input-manual-barcode" placeholder="พิมพ์เลขพัสดุ Tracking ID..." class="flex-1 px-3 py-2 text-xs font-mono font-bold rounded-lg bg-slate-900 border border-slate-600 text-white focus:outline-none focus:border-emerald-500">
        <button id="btn-submit-manual" class="px-4 py-2 text-xs font-bold text-white bg-emerald-600 rounded-lg">
          ส่ง
        </button>
      </div>
    </div>

    <!-- Real-time Result HUD Banner (Prominent display) -->
    <div id="scan-hud-mobile" class="p-3.5 rounded-xl border-2 border-slate-700 bg-slate-800/90 flex items-start gap-3 shadow-md transition-all">
      <div class="shrink-0 mt-0.5 text-slate-400">
        <i data-lucide="scan" class="w-6 h-6"></i>
      </div>
      <div class="flex-1 min-w-0">
        <div class="font-bold text-sm text-white">พร้อมสแกนลาเบลพัสดุ</div>
        <div class="text-xs text-slate-400 mt-0.5 truncate">ระบบจะค้นหาและจับคู่กับคำสั่งซื้อของวันนี้ให้อัตโนมัติ</div>
      </div>
    </div>

    <!-- Recent Scans Stream on Mobile -->
    <div class="flex-1 bg-slate-800/60 rounded-xl p-3 border border-slate-700 flex flex-col overflow-hidden">
      <div class="text-xs font-bold text-slate-400 mb-2 flex items-center justify-between">
        <span>ประวัติการสแกนล่าสุด</span>
        <span class="text-[10px] text-slate-500">ส่งตรงไปยังจอคลัง</span>
      </div>
      <div id="mobile-recent-scans-list" class="space-y-1.5 overflow-y-auto max-h-48 text-xs font-mono">
        <!-- Rendered dynamically -->
        <div class="text-center py-4 text-slate-500 text-[11px]">ยังไม่มีประวัติการสแกน</div>
      </div>
    </div>

  </main>

  <!-- Core Scripts -->
  <script src="audio-feedback.js?v=2.6"></script>
  <script src="camera-scanner.js?v=2.6"></script>
  <script src="sync-service.js?v=2.6"></script>
  <script>
    (function () {
      'use strict';
      
      const $ = (id) => document.getElementById(id);
      let orders = [];
      let scans = [];
      const today = new Date().toISOString().split('T')[0];

      if ($('mobile-date-display')) $('mobile-date-display').innerText = today;

      // Initialize Sync
      SyncService.init({
        onRemoteScan: (remoteScan) => {
          if (remoteScan && !scans.some(s => s.id === remoteScan.id)) {
            scans.unshift(remoteScan);
            updateScannedCount();
            renderMobileScans();
          }
        },
        onRemoteOrders: (newOrders) => {
          orders = newOrders;
          renderMobileScans();
        }
      });
      orders = SyncService.getLocalOrders();
      scans = SyncService.getLocalScans();

      updateScannedCount();
      renderMobileScans();

      // Camera Toggle
      const btnCam = $('btn-toggle-mobile-camera');
      if (btnCam) {
        btnCam.addEventListener('click', async () => {
          if (CameraScanner.isRunning()) {
            await CameraScanner.stop();
            btnCam.innerHTML = '<i data-lucide="camera" class="w-4 h-4"></i> เปิดกล้องสแกน';
          } else {
            const ok = await CameraScanner.start('reader-mobile', 'camera-box-mobile', (code) => {
              handleMobileScan(code);
            });
            if (ok) {
              btnCam.innerHTML = '<i data-lucide="camera-off" class="w-4 h-4"></i> ปิดกล้อง';
            }
          }
          lucide.createIcons();
        });
      }

      // Manual Input Toggle
      const btnManual = $('btn-manual-input-toggle');
      const manualBox = $('manual-input-box');
      if (btnManual && manualBox) {
        btnManual.addEventListener('click', () => {
          manualBox.classList.toggle('hidden');
          if (!manualBox.classList.contains('hidden')) {
            $('input-manual-barcode').focus();
          }
        });
      }

      // Manual Submit
      const btnSubmit = $('btn-submit-manual');
      const inputManual = $('input-manual-barcode');
      if (btnSubmit && inputManual) {
        btnSubmit.addEventListener('click', () => {
          const val = inputManual.value.trim();
          if (val) {
            handleMobileScan(val);
            inputManual.value = '';
          }
        });
        inputManual.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            const val = inputManual.value.trim();
            if (val) {
              handleMobileScan(val);
              inputManual.value = '';
            }
          }
        });
      }

      // Scan Handler
      function handleMobileScan(rawBarcode) {
        AudioFeedback.init();
        const clean = String(rawBarcode || '').replace(/[\s\u00A0]/g, '').toUpperCase();
        if (!clean) return;

        const scannerName = ($('input-mobile-scanner-name')?.value || 'มือถือหน้ารถ').trim();

        // Query today's orders
        const matchedOrders = orders.filter(o => o.shipDate === today && o.cleanTracking === clean);
        const totalOrdersToday = orders.filter(o => o.shipDate === today).length;
        const existingScansToday = scans.filter(s => s.scanDate === today && s.cleanTracking === clean);
        const isDuplicate = existingScansToday.length > 0;

        let matchResult = '';
        let matchedOrder = null;

        if (matchedOrders.length === 1) {
          matchResult = 'พบในรายการส่ง';
          matchedOrder = matchedOrders[0];
        } else if (matchedOrders.length > 1) {
          matchResult = 'รายการส่งซ้ำ';
          matchedOrder = matchedOrders[0];
        } else {
          // Unconditionally set to รอนำเข้าออเดอร์ for any unmatched barcode
          matchResult = 'รอนำเข้าออเดอร์';
        }

        const now = new Date();
        const timeStr = now.toTimeString().split(' ')[0];

        const newScan = {
          id: 'SCAN-MOB-' + Date.now() + '-' + Math.random().toString(36).substring(2, 6),
          scanDate: today,
          scanTime: timeStr,
          trackingId: rawBarcode.trim(),
          cleanTracking: clean,
          scanner: scannerName,
          source: 'กล้องมือถือ',
          matchResult: matchResult,
          isDuplicateScan: isDuplicate,
          matchedOrderId: matchedOrder ? matchedOrder.orderId : '',
          matchedSku: matchedOrder ? matchedOrder.sku : '',
          matchedQty: matchedOrder ? matchedOrder.qty : '',
          matchedCarrier: matchedOrder ? matchedOrder.carrier : ''
        };

        scans.unshift(newScan);
        SyncService.addLocalScan(newScan);

        // Feedback
        showFeedback(newScan, isDuplicate, matchedOrders.length);
        updateScannedCount();
        renderMobileScans();
      }

      function showFeedback(scan, isDuplicate, matchCount) {
        const hud = $('scan-hud-mobile');
        if (!hud) return;

        if (scan.matchResult === 'พบในรายการส่ง') {
          if (!isDuplicate) {
            AudioFeedback.success();
            CameraScanner.flashBox('success');
            hud.className = 'p-3.5 rounded-xl border-2 border-emerald-500 bg-emerald-950/80 text-emerald-200 flex items-start gap-3 shadow-md';
            hud.innerHTML = `
              <div class="shrink-0 text-emerald-400 mt-0.5"><i data-lucide="check-circle-2" class="w-6 h-6"></i></div>
              <div class="flex-1 min-w-0">
                <div class="font-bold text-sm text-emerald-100">✅ สแกนสำเร็จ: ${scan.trackingId}</div>
                <div class="text-xs text-emerald-300/90 mt-0.5 truncate">Order: ${scan.matchedOrderId || '-'} | ขนส่ง: ${scan.matchedCarrier || '-'} | SKU: ${scan.matchedSku || '-'} (${scan.matchedQty} ชิ้น)</div>
              </div>
            `;
          } else {
            AudioFeedback.duplicate();
            CameraScanner.flashBox('duplicate');
            hud.className = 'p-3.5 rounded-xl border-2 border-amber-500 bg-amber-950/80 text-amber-200 flex items-start gap-3 shadow-md';
            hud.innerHTML = `
              <div class="shrink-0 text-amber-400 mt-0.5"><i data-lucide="alert-triangle" class="w-6 h-6"></i></div>
              <div class="flex-1 min-w-0">
                <div class="font-bold text-sm text-amber-100">🔁 สแกนซ้ำ: ${scan.trackingId}</div>
                <div class="text-xs text-amber-300/90 mt-0.5 truncate">พัสดุนี้ถูกสแกนไปแล้วในวันนี้! (Order: ${scan.matchedOrderId || '-'})</div>
              </div>
            `;
          }
        } else if (scan.matchResult === 'รอนำเข้าคำสั่งซื้อ' || scan.matchResult === 'รอนำเข้าออเดอร์') {
          if (!isDuplicate) {
            AudioFeedback.pending();
            CameraScanner.flashBox('pending');
            hud.className = 'p-3.5 rounded-xl border-2 border-sky-500 bg-sky-950/80 text-sky-200 flex items-start gap-3 shadow-md';
            hud.innerHTML = `
              <div class="shrink-0 text-sky-400 mt-0.5"><i data-lucide="clock" class="w-6 h-6"></i></div>
              <div class="flex-1 min-w-0">
                <div class="font-bold text-sm text-sky-100">📦 บันทึกแล้ว (รอนำเข้าออเดอร์): ${scan.trackingId}</div>
                <div class="text-xs text-sky-300/90 mt-0.5">บันทึกเวลาสแกนเรียบร้อย ระบบจะจับคู่ย้อนหลังให้อัตโนมัติเมื่อนำเข้าออเดอร์</div>
              </div>
            `;
          } else {
            AudioFeedback.duplicate();
            CameraScanner.flashBox('duplicate');
            hud.className = 'p-3.5 rounded-xl border-2 border-amber-500 bg-amber-950/80 text-amber-200 flex items-start gap-3 shadow-md';
            hud.innerHTML = `
              <div class="shrink-0 text-amber-400 mt-0.5"><i data-lucide="alert-triangle" class="w-6 h-6"></i></div>
              <div class="flex-1 min-w-0">
                <div class="font-bold text-sm text-amber-100">🔁 สแกนซ้ำ: ${scan.trackingId}</div>
                <div class="text-xs text-amber-300/90 mt-0.5 truncate">พัสดุนี้ถูกสแกนไปแล้วในวันนี้ (สถานะ: รอนำเข้าออเดอร์)</div>
              </div>
            `;
          }
        } else if (scan.matchResult === 'ไม่พบในรายการส่งของวันนี้') {
          AudioFeedback.error();
          CameraScanner.flashBox('error');
          hud.className = 'p-3.5 rounded-xl border-2 border-rose-500 bg-rose-950/80 text-rose-200 flex items-start gap-3 shadow-md';
          hud.innerHTML = `
            <div class="shrink-0 text-rose-400 mt-0.5"><i data-lucide="x-circle" class="w-6 h-6"></i></div>
            <div class="flex-1 min-w-0">
              <div class="font-bold text-sm text-rose-100">🚨 ไม่พบในรายการส่งวันนี้: ${scan.trackingId}</div>
              <div class="text-xs text-rose-300/90 mt-0.5">ไม่อยู่ในรายการส่งของวันนี้ (หากยังไม่ได้คีย์ออเดอร์เข้าระบบ เมื่อคีย์เข้าจะจับคู่ย้อนหลังให้อัตโนมัติ)</div>
            </div>
          `;
        } else {
          AudioFeedback.warning();
          CameraScanner.flashBox('duplicate');
          hud.className = 'p-3.5 rounded-xl border-2 border-purple-500 bg-purple-950/80 text-purple-200 flex items-start gap-3 shadow-md';
          hud.innerHTML = `
            <div class="shrink-0 text-purple-400 mt-0.5"><i data-lucide="alert-circle" class="w-6 h-6"></i></div>
            <div class="flex-1 min-w-0">
              <div class="font-bold text-sm text-purple-100">⚠️ รายการส่งซ้ำ: ${scan.trackingId}</div>
              <div class="text-xs text-purple-300/90 mt-0.5 truncate">พบเลขพัสดุนี้ซ้ำในรายการส่ง ${matchCount} รายการ!</div>
            </div>
          `;
        }
        lucide.createIcons();
      }

      function updateScannedCount() {
        const todayScans = scans.filter(s => s.scanDate === today);
        if ($('mobile-scanned-count')) $('mobile-scanned-count').innerText = todayScans.length;
      }

      function renderMobileScans() {
        const listEl = $('mobile-recent-scans-list');
        if (!listEl) return;

        const todayScans = scans.filter(s => s.scanDate === today).slice(0, 15);
        if (todayScans.length === 0) {
          listEl.innerHTML = '<div class="text-center py-4 text-slate-500 text-[11px]">ยังไม่มีประวัติการสแกน</div>';
          return;
        }

        let html = '';
        todayScans.forEach(s => {
          const mOrders = orders.filter(o => o.shipDate === today && o.cleanTracking === s.cleanTracking);
          let dotColor = 'bg-emerald-400';
          let statusText = 'พบในรายการส่ง';
          let textColor = 'text-emerald-400';

          if (mOrders.length === 1) {
            dotColor = 'bg-emerald-400';
            statusText = mOrders[0].orderId;
            textColor = 'text-emerald-300';
          } else if (mOrders.length > 1) {
            dotColor = 'bg-purple-400';
            statusText = 'ออเดอร์ซ้ำ';
            textColor = 'text-purple-300';
          } else {
            dotColor = 'bg-sky-400';
            statusText = 'รอนำเข้าออเดอร์';
            textColor = 'text-sky-300';
          }

          if (s.isDuplicateScan) {
            dotColor = 'bg-amber-400';
          }

          html += `
            <div class="bg-slate-900/80 p-2.5 rounded-lg border border-slate-700/80 flex items-center justify-between gap-2">
              <div class="flex items-center gap-2 min-w-0">
                <span class="w-2 h-2 rounded-full ${dotColor} shrink-0"></span>
                <div class="min-w-0">
                  <div class="font-bold text-white tracking-wide truncate text-xs">${s.trackingId}</div>
                  <div class="text-[10px] ${textColor} truncate font-sans">${statusText}</div>
                </div>
              </div>
              <div class="text-[10px] text-slate-400 shrink-0 font-mono">
                ${s.scanTime}
              </div>
            </div>
          `;
        });
        listEl.innerHTML = html;
        lucide.createIcons();
      }

      // Auto start camera if supported on mobile
      setTimeout(() => {
        if (window.innerWidth < 768 && !CameraScanner.isRunning()) {
          CameraScanner.start('reader-mobile', 'camera-box-mobile', (code) => {
            handleMobileScan(code);
          }).then((ok) => {
            if (ok && btnCam) {
              btnCam.innerHTML = '<i data-lucide="camera-off" class="w-4 h-4"></i> ปิดกล้อง';
              lucide.createIcons();
            }
          });
        }
      }, 600);

      lucide.createIcons();
    })();
  </script>
</body>
</html>
